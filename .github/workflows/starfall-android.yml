name: Starfall Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - star-wars-shattered-fates

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Install Expo-compatible WebView
        run: npx expo install react-native-webview

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build release APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: starfall-shattered-fates-release-apk
          path: android/app/build/outputs/apk/release/*.apk
