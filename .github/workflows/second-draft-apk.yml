name: Build Second Draft APK

on:
  push:
    branches:
      - second-draft-life-sim-apk
    paths:
      - "second-draft-godot/**"
      - ".github/workflows/second-draft-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-debug-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Publish started receipt
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          RECEIPT_DIR=".github/build-receipts"
          RECEIPT_PATH="$RECEIPT_DIR/second-draft-v0.4.json"
          mkdir -p "$RECEIPT_DIR"
          printf '{\n  "status": "in_progress",\n  "source_sha": "%s",\n  "run_id": %s,\n  "artifact_id": "",\n  "apk_sha256": "",\n  "apk_size_bytes": 0\n}\n' \
            "$SOURCE_SHA" "$RUN_ID" > "$RECEIPT_PATH"
          git config user.name "Second Draft CI"
          git config user.email "actions@users.noreply.github.com"
          git add "$RECEIPT_PATH"
          git commit -m "Start Second Draft v0.4 build $RUN_ID"
          git push origin "HEAD:second-draft-life-sim-apk"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Install Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_ZIP="$RUNNER_TEMP/godot.zip"
          TEMPLATES_TPZ="$RUNNER_TEMP/templates.tpz"
          curl --fail --location --retry 3 --output "$GODOT_ZIP" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 --output "$TEMPLATES_TPZ" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          unzip -q "$GODOT_ZIP" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          sudo mv "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q "$TEMPLATES_TPZ" -d "$RUNNER_TEMP/godot-templates"
          cp -R "$RUNNER_TEMP/godot-templates/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          godot --version

      - name: Configure Android exporter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Second Draft,C=CA" \
            -noprompt
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/debug_keystore = \"$HOME/.android/debug.keystore\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            > "$HOME/.config/godot/editor_settings-4.7.tres"

      - name: Import and test project
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 120s godot --headless --path second-draft-godot --import
          timeout --signal=KILL 60s godot --headless --path second-draft-godot --script res://tests/test_catalog.gd
          timeout --signal=KILL 90s godot --headless --path second-draft-godot --script res://tests/test_career_catalog.gd
          timeout --signal=KILL 120s godot --headless --path second-draft-godot --script res://tests/test_procedural_systems.gd
          timeout --signal=KILL 60s godot --headless --path second-draft-godot --script res://tests/test_simulation.gd
          timeout --signal=KILL 90s godot --headless --path second-draft-godot --script res://tests/test_mobile_ui.gd
          timeout --signal=KILL 60s godot --headless --path second-draft-godot --quit-after 30 2>&1 | tee "$RUNNER_TEMP/godot-smoke.log"
          if grep -E "ERROR:|SCRIPT ERROR|Parse Error|Invalid call|Invalid assignment" "$RUNNER_TEMP/godot-smoke.log"; then
            exit 1
          fi

      - name: Export debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          mkdir -p second-draft-godot/build
          godot --headless --path second-draft-godot \
            --export-debug Android \
            "$GITHUB_WORKSPACE/second-draft-godot/build/SecondDraft_v0.4.apk"
          test -s second-draft-godot/build/SecondDraft_v0.4.apk
          sha256sum second-draft-godot/build/SecondDraft_v0.4.apk

      - name: Upload APK
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: SecondDraft-Android-v0.4
          path: second-draft-godot/build/SecondDraft_v0.4.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish build receipt
        if: always()
        shell: bash
        env:
          BUILD_STATUS: ${{ job.status }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.upload-apk.outputs.artifact-id }}
        run: |
          set -euo pipefail
          RECEIPT_DIR=".github/build-receipts"
          RECEIPT_PATH="$RECEIPT_DIR/second-draft-v0.4.json"
          APK_PATH="second-draft-godot/build/SecondDraft_v0.4.apk"
          mkdir -p "$RECEIPT_DIR"
          APK_SHA256=""
          APK_SIZE=0
          if test -s "$APK_PATH"; then
            APK_SHA256="$(sha256sum "$APK_PATH" | cut -d ' ' -f 1)"
            APK_SIZE="$(stat -c '%s' "$APK_PATH")"
          fi
          printf '{\n  "status": "%s",\n  "source_sha": "%s",\n  "run_id": %s,\n  "artifact_id": "%s",\n  "apk_sha256": "%s",\n  "apk_size_bytes": %s\n}\n' \
            "$BUILD_STATUS" "$SOURCE_SHA" "$RUN_ID" "$ARTIFACT_ID" "$APK_SHA256" "$APK_SIZE" \
            > "$RECEIPT_PATH"
          git config user.name "Second Draft CI"
          git config user.email "actions@users.noreply.github.com"
          git add "$RECEIPT_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "Record Second Draft v0.4 build $RUN_ID"
            git push origin "HEAD:second-draft-life-sim-apk"
          fi
