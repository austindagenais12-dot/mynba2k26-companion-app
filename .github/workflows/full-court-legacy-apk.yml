name: Build Full Court Legacy APK

on:
  push:
    branches:
      - full-court-legacy-godot-apk
    paths:
      - "full-court-legacy-godot/**"
      - ".github/workflows/full-court-legacy-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Install Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_ZIP="$RUNNER_TEMP/godot.zip"
          TEMPLATES_TPZ="$RUNNER_TEMP/templates.tpz"
          curl --fail --location --retry 3 --output "$GODOT_ZIP" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 --output "$TEMPLATES_TPZ" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          unzip -q "$GODOT_ZIP" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          sudo mv "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q "$TEMPLATES_TPZ" -d "$RUNNER_TEMP/godot-templates"
          cp -R "$RUNNER_TEMP/godot-templates/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          godot --version

      - name: Configure Android exporter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Full Court Legacy,C=CA" \
            -noprompt
          printf '%s\n' \
            '[gd_resource format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/debug_keystore = \"$HOME/.android/debug.keystore\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            > "$HOME/.config/godot/editor_settings-4.7.tres"

      - name: Import and smoke-test project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path full-court-legacy-godot --quit-after 4
          godot --headless --path full-court-legacy-godot --quit-after 20 2>&1 | tee "$RUNNER_TEMP/godot-smoke.log"
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid assignment" "$RUNNER_TEMP/godot-smoke.log"; then
            exit 1
          fi

      - name: Export debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.debug-keystore-placeholder
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          mkdir -p full-court-legacy-godot/build
          godot --headless --path full-court-legacy-godot \
            --export-debug Android \
            "$GITHUB_WORKSPACE/full-court-legacy-godot/build/FullCourtLegacy_v0.1.apk"
          test -s full-court-legacy-godot/build/FullCourtLegacy_v0.1.apk
          sha256sum full-court-legacy-godot/build/FullCourtLegacy_v0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FullCourtLegacy-Android-v0.1
          path: full-court-legacy-godot/build/FullCourtLegacy_v0.1.apk
          if-no-files-found: error
          retention-days: 30
