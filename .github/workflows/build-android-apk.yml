name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
        env:
          CI: "1"

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Read app version
        id: app
        run: echo "version=$(node -p \"require('./app.json').expo.version\")" >> "$GITHUB_OUTPUT"

      - name: Name APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk "output/NBA2K26_Career_Companion_v${{ steps.app.outputs.version }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NBA2K26-Career-Companion-v${{ steps.app.outputs.version }}-APK
          path: output/NBA2K26_Career_Companion_v${{ steps.app.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 7
